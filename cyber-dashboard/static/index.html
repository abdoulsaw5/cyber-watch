<!doctype html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Watch</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <svg id="map" aria-label="World map. Highlighted countries are clickable."></svg>
  <div class="scan" aria-hidden="true"></div>
  <div class="sweep" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <span class="dot"></span>
      <h1>Cyber Watch</h1>
      <span class="sub">Global threat &amp; tech feed</span>
    </div>
    <nav id="tabs" class="tabs" aria-label="Categories"></nav>
    <div class="status">
      <span id="clock">--:--:--</span>
      <button id="updated" class="statusbtn" title="Show source health">Loading</button>
      <label class="themewrap">Theme
        <select id="theme" class="themesel" aria-label="Theme">
          <option value="midnight">Midnight</option>
          <option value="newsroom">Newsroom</option>
          <option value="daylight">Daylight</option>
          <option value="command">Command (original)</option>
        </select>
      </label>
      <button id="refresh" class="btn" title="Refresh feeds">Refresh</button>
    </div>
  </header>

  <main class="layout">
    <section class="panel feed" aria-label="Headlines">
      <div class="panel-head">
        <span id="count">0 stories</span>
        <div class="head-actions">
          <button id="priority" class="chip hidden" aria-pressed="false" title="Show only stories flagged as urgent or high risk">Priority only</button>
          <button id="clearfilter" class="chip hidden">Clear region</button>
        </div>
      </div>
      <div id="desc" class="desc"></div>
      <ul id="list" class="list"></ul>
    </section>

    <aside id="reader" class="panel reader hidden" aria-label="Article reader">
      <div class="reader-bar">
        <button id="closereader" class="btn">Close</button>
        <a id="openorig" class="btn primary" target="_blank" rel="noopener noreferrer">Open on site</a>
      </div>
      <div class="reader-body">
        <div id="rsource" class="muted"></div>
        <h2 id="rtitle"></h2>
        <div id="rtext"></div>
      </div>
    </aside>
  </main>

  <aside id="health" class="panel health hidden" aria-label="Source health">
    <div class="panel-head">
      <span id="healthsum">Sources</span>
      <button id="closehealth" class="chip">Close</button>
    </div>
    <ul id="healthlist" class="list"></ul>
  </aside>

  <footer class="ticker" aria-hidden="true"><div id="ticker" class="ticker-track"></div></footer>

  <script src="/static/vendor/d3.min.js"></script>
  <script src="/static/vendor/topojson-client.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
